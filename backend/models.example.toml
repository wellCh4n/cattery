# Cattery model catalog. Copy to models.toml (gitignored: it holds API keys),
# or point MODELS_CONFIG at another path. Read once at backend startup.
#
# Each [[providers]] entry is one endpoint + key; users can pick any of its
# models in the chat. Model ids are sent to the endpoint as-is and must be
# unique across providers.
#
# type is the pi-ai provider id: anthropic | deepseek | openai reuse pi's
# built-in catalog entry for each model (context window, thinking levels,
# provider quirks); custom is any other OpenAI-compatible endpoint.
#
# api (optional) overrides the wire protocol pi-ai speaks to the endpoint:
# openai-completions | openai-responses | anthropic-messages. Empty keeps the
# protocol pi's catalog uses for the type. DeepSeek also serves
# openai-responses, which ends thinking blocks as soon as reasoning ends.
#
# efforts (optional) are the thinking efforts users can pick, lowest to
# highest, from: off, minimal, low, medium, high, xhigh, max. Default:
# low, medium, high. Sessions start on high if offered, else the highest.

# Model new sessions start on (optional; defaults to the first model listed).
default = "deepseek-flash"

# Lightweight tasks (currently automatic session titles). References a model
# listed below, reusing its endpoint and key. Omitted: use default, independent
# of the session model. Restart the backend after changes.
small_model = "deepseek-flash"

[[providers]]
name     = "DeepSeek"
type     = "deepseek"
endpoint = "https://api.deepseek.com"
api      = "openai-responses"
key      = "sk-..."
models   = ["deepseek-flash", "deepseek-v4-pro"]
efforts  = ["low", "high", "max"]

