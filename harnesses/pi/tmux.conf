# Web terminal defaults. Each Cattery terminal attaches a tmux session named
# after its terminal id, so commands keep running when the browser disconnects.

# Look like a plain shell: no status bar, login bash.
set -g status off
set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -g escape-time 10

# tmux redraws the screen, so the browser's own scrollback is useless: keep a
# long history here and let the wheel scroll it. Selections copy to the
# browser clipboard via OSC 52 (xterm.js clipboard addon); Option/Alt-drag
# does a native selection instead.
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
