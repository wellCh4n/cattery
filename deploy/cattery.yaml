# The global skill library (SKILLS_DIR). Clusters that ran the retired
# skillmgr Pod already have this claim, created by the backend, and keep it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cattery-skills-work
  labels:
    app.kubernetes.io/name: cattery
    app.kubernetes.io/component: skills
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: cattery
  labels:
    app.kubernetes.io/name: cattery
spec:
  selector:
    app.kubernetes.io/name: cattery
  ports:
    - name: backend
      port: 8080
      targetPort: backend
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cattery
  labels:
    app.kubernetes.io/name: cattery
spec:
  # The backend keeps per-process state (sandbox bring-up, usage sync), so
  # run one replica and never two side by side: a StatefulSet replaces its Pod
  # only after the old one is gone.
  replicas: 1
  serviceName: cattery
  selector:
    matchLabels:
      app.kubernetes.io/name: cattery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cattery
    spec:
      # Created by cluster/rbac.yaml: lets the backend manage Sandboxes, Pods and
      # PVCs in this namespace.
      serviceAccountName: cattery
      containers:
        - name: backend
          image: cattery-backend
          ports:
            - name: backend
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            # local-path volumes are single-node; project Pods mount theirs
            # from one Pod, so ReadWriteOnce is enough.
            - name: K8S_PVC_ACCESS_MODE
              value: ReadWriteOnce
            - name: MODELS_CONFIG
              value: /etc/cattery/models.toml
            # Must match the preview host in ingress.yaml. Preview cookies are
            # Secure, so production previews need https.
            - name: PREVIEW_URL
              value: https://*.preview.example.com
            # The image the backend starts for each project. kustomize's
            # images: does not reach it, so set the registry and tag here.
            - name: PI_IMAGE
              value: registry.example.com/cattery-pi:latest
            - name: SKILLS_DIR
              value: /var/lib/cattery/skills
          # JWT_SECRET, DATABASE_URL and CHANNEL_SECRET_KEY.
          envFrom:
            - secretRef: {name: cattery-env}
          livenessProbe:
            httpGet: {path: /healthz, port: backend}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: backend}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: models
              mountPath: /etc/cattery
              readOnly: true
            - name: skills
              mountPath: /var/lib/cattery/skills
        - name: web
          image: cattery-web
          ports:
            - name: web
              containerPort: 3000
          readinessProbe:
            tcpSocket: {port: web}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: models
          secret:
            secretName: cattery-models
        - name: skills
          persistentVolumeClaim:
            claimName: cattery-skills-work
