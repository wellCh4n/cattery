# ServiceAccount + RBAC for the Cattery backend.
#
# The backend connects to the K8s API via in-cluster config
# (rest.InClusterConfig, backend/internal/k8s/client.go), which reads the token
# of the ServiceAccount referenced by the Pod's `serviceAccountName`. No
# kubeconfig is needed in-cluster.
#
# Permissions are scoped to exactly what the backend uses: it creates/reads/
# deletes Sandbox CRs, Pods (legacy cleanup), and PVCs, all within
# K8S_NAMESPACE. Get is used to poll readiness, so no watch/update/patch needed.
# pods/exec backs the web terminal; WebSocket exec is a GET and SPDY a POST, and
# clusters before 1.35 authorize them as get and create respectively.
#
# Applied as part of the Kustomize bundle (deploy/cluster/kustomization.yaml),
# which also creates the namespace and the upstream Agent Sandbox controller:
#   kubectl apply -k deploy/cluster/
# deploy/cattery.yaml runs the backend as this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cattery
  namespace: cattery # keep aligned with K8S_NAMESPACE
  labels:
    app.kubernetes.io/name: cattery
    app.kubernetes.io/part-of: cattery
    app.kubernetes.io/component: backend
---
# Role is namespace-scoped. If the backend must create sandboxes in a different
# namespace than its own, switch this pair to ClusterRole + ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cattery-backend
  namespace: cattery
  labels:
    app.kubernetes.io/name: cattery
    app.kubernetes.io/part-of: cattery
    app.kubernetes.io/component: backend
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cattery-backend
  namespace: cattery
  labels:
    app.kubernetes.io/name: cattery
    app.kubernetes.io/part-of: cattery
    app.kubernetes.io/component: backend
subjects:
  - kind: ServiceAccount
    name: cattery
    namespace: cattery
roleRef:
  kind: Role
  name: cattery-backend
  apiGroup: rbac.authorization.k8s.io
